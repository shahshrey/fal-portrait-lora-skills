name: Bug report
description: Report a problem with a skill or script
labels: ["bug"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - lora-dataset-prep
        - fal-lora-training
        - install / repo tooling
        - unsure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug. Redact API keys and private photo paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps / commands
      render: bash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 15 / Python 3.12 / Cursor ..."
    validations:
      required: true
