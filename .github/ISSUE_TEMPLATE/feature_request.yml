name: Feature request
description: Propose an improvement or new related skill
labels: ["enhancement"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Area
      options:
        - lora-dataset-prep
        - fal-lora-training
        - new related skill
        - docs / DX
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What pain point does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional, but helpful for review.
